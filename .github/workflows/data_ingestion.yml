name: 🌤️ Hourly Data Ingestion to Hopsworks

on:
  schedule:
    - cron: '0 * * * *'  # every hour

jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ingestion + Hopsworks push
        run: python open_metro_hopswork_pushed_v3.py
